<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Chronicles of the Chosen</title>
  <link rel="icon" href="public/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #f0c060;
      --gold-dk: #a07820;
      --blue:    #3a8fd4;
      --purple:  #7c4dff;
      --dark:    #0a0a14;
      --darker:  #05050c;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--darker);
      overflow: hidden;
      font-family: 'Crimson Text', serif;
    }

    #game-container {
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phaser canvas sits here */
    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* ── Mobile HUD overlay ── */
    #mobile-hud {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      pointer-events: none;
      z-index: 100;
    }

    #btn-left, #btn-right, #btn-up, #btn-shoot {
      position: absolute;
      pointer-events: all;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background 0.1s;
    }
    #btn-left:active, #btn-right:active, #btn-up:active, #btn-shoot:active {
      background: rgba(255,255,255,0.25);
    }

    #btn-left  { width: 64px; height: 64px; bottom: 48px; left: 24px; }
    #btn-right { width: 64px; height: 64px; bottom: 48px; left: 104px; }
    #btn-up    { width: 64px; height: 64px; bottom: 48px; left: 64px; top: 24px; }
    #btn-shoot { width: 64px; height: 64px; bottom: 48px; right: 24px; background: rgba(120,60,200,0.5); }

    @media (max-width: 768px) {
      #mobile-hud { display: block; }
    }

    /* ── Loading screen ── */
    #loading-screen {
      position: fixed; inset: 0;
      background: var(--darker);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
      z-index: 999;
      transition: opacity 0.8s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    #loading-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(28px, 5vw, 56px);
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(240,192,96,0.5);
      letter-spacing: 0.08em;
      text-align: center;
      padding: 0 16px;
    }
    #loading-sub {
      font-family: 'Cinzel', serif;
      font-size: clamp(12px, 2vw, 16px);
      color: rgba(240,192,96,0.55);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    #loading-bar-wrap {
      width: min(320px, 80vw);
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-dk), var(--gold));
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    #loading-tip {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      text-align: center;
      max-width: 340px;
      padding: 0 16px;
      min-height: 36px;
    }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
  <div id="loading-title">Chronicles<br>of the Chosen</div>
  <div id="loading-sub">Crónicas de los Elegidos</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-tip">Cargando mundo…</div>
</div>

<!-- Game canvas -->
<div id="game-container"></div>

<!-- Mobile controls -->
<div id="mobile-hud">
  <div id="btn-left">◀</div>
  <div id="btn-right">▶</div>
  <div id="btn-up">▲</div>
  <div id="btn-shoot">✦</div>
</div>

<!-- Phaser 3 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<!-- Game source -->
<script type="module" src="src/main.js"></script>
</body>
</html>
